name: Recipe Sharing CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  build-and-deploy:
    name: Build and Deploy to Cloud Run
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: '${{ secrets.GCP_PROJECT_ID }}'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Diagnose Google Cloud permissions
        run: |
          echo "Authenticated account:"
          gcloud auth list --filter="status:ACTIVE" --format="value(account)"
          echo "Configured project:"
          gcloud config get-value project
          echo "Checking bucket access:"
          gcloud storage ls gs://recipe-sharing-app-cloud_cloudbuild

      - name: Build and deploy backend
        run: gcloud builds submit --project='${{ secrets.GCP_PROJECT_ID }}' --config=cloudbuild-backend.yaml .

      - name: Build and deploy frontend
        run: gcloud builds submit --project='${{ secrets.GCP_PROJECT_ID }}' --config=cloudbuild-frontend.yaml .
